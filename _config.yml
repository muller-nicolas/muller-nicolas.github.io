  email            : "nicolas.muller@lpp.polytechnique.fr"
  googlescholar    : "https://scholar.google.com/citations?user=ymtN63gAAAAJ&hl=en"
  github           : "muller-nicolas"
  orcid            : "https://orcid.org/0000-0003-2204-7873"
