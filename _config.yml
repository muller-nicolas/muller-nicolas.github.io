# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Nicolás Pablo Müller
email: nicolas-muller@lpp.polytechnique.fr
description: >- # this means to ignore newlines until "baseurl:"
  Nicolás Müller's research on turbulence, superfluids, geodynamo, and magnetoacoustic waves in the solar wind. 
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://muller-nicolas.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: muller-nicolas

# Build settings
remote_theme: mmistakes/minimal-mistakes

#theme: minimal-mistakes-jekyll
#theme: jekyll-theme-minimal
minimal_mistakes_skin  : "default" #, "contrast", "dark", "dirt", "neon", "plum", "sunrise"

include:
  - _pages
  # - _posts

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

lsi: false
safe: true
#source: [your repo's top level directory]
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

locale                   : "en-US"
title                    : "Nicolás Pablo Müller"
title_separator          : "-"
name                     : &name "Nicolás Pablo Müller"
description              : &description "Postdoctoral Researcher"
url                      : https://muller-nicolas.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "muller-nicolas/muller-nicolas.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  path                   : # blank (default) uses feed.xml
  # theme                  : minimal-mistakes-jekyll
    #  minimal_mistakes_skin  : "mint" #"default", "air", "aqua", "contrast", "dark", "dirt", "neon", "plum", "sunrise"
  minimal_mistakes_skin  : "aqua" #, "contrast", "dark", "dirt", "neon", "plum", "sunrise"
    
# Site Author
author:
  name             : "Nicolás P. Müller"
  avatar           : "/files/profile_pic.jpg"
  bio              : "Postdoctoral Researcher"
  location         : "LPP, Palaiseau, France"
